<!-- Moments: a page (one at a time, replacing the brews view; see src/app/pages.js).
     The element keeps its old id, galleryModal, so the gallery code and routes still find it. -->
<div id="galleryModal" data-app-page="moments" class="hidden">
    <div class="app-page-panel relative">
        <div class="app-page-head py-4 flex flex-wrap justify-between items-center gap-3">
            <h3 class="app-page-title font-bold text-xl text-coffee-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-images text-coffee-600 dark:text-[#d6ccc2]"></i>
                <span>Moments</span>
            </h3>
            <!-- Whose moments: an iOS-style segmented control (switchGalleryTab sets aria-selected) -->
            <div class="app-segmented" role="tablist" aria-label="Whose moments">
                <button type="button" role="tab" aria-selected="true" data-action-click="switchGalleryTab('shared')" id="tabGalleryShared" class="app-segmented-item">
                    <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                    <span>Friends</span>
                    <span id="tabGallerySharedBadge" class="hidden app-segmented-badge" aria-label="New"></span>
                </button>
                <button type="button" role="tab" aria-selected="false" data-action-click="switchGalleryTab('mine')" id="tabGalleryMine" class="app-segmented-item">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <span>Mine</span>
                    <span id="tabGalleryMineBadge" class="hidden app-segmented-badge" aria-label="New"></span>
                </button>
            </div>
        </div>
        <div id="galleryLoading" class="hidden py-16 flex flex-col items-center justify-center gap-3 text-coffee-600 dark:text-[#a8a29e]">
            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
            <p class="text-sm font-medium">Loading moments...</p>
        </div>
        <div id="momentOutsideSharePrompt" class="hidden fixed inset-0 z-[10070] flex items-center justify-center bg-black/45 p-4">
            <div class="w-full max-w-sm rounded-xl border border-coffee-200 dark:border-[#57534e] bg-white dark:bg-[#292524] p-4 shadow-xl">
                <p class="text-sm font-semibold text-coffee-900 dark:text-white mb-3">Share this moment outside the app?</p>
                <div class="flex items-center justify-end gap-2">
                    <button id="momentOutsideShareNoBtn" type="button" class="px-3 py-1.5 rounded-lg text-sm border border-coffee-200 dark:border-[#57534e] text-coffee-700 dark:text-[#d6ccc2] hover:bg-coffee-100 dark:hover:bg-[#34302e]">Cancel</button>
                    <button id="momentOutsideShareYesBtn" type="button" class="px-3 py-1.5 rounded-lg text-sm bg-coffee-700 hover:bg-coffee-800 dark:bg-[#57534e] text-white">Share</button>
                </div>
            </div>
        </div>
        <div id="galleryContent" class="pb-4">
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
            <div id="galleryLoadMore" class="text-center py-4 hidden">
                <button data-action-click="loadMoreGallery()" class="bg-coffee-100 dark:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] px-6 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-coffee-200 dark:hover:bg-[#44403c] transition-colors">Load More <i class="fa-solid fa-chevron-down ml-2"></i></button>
            </div>
            <div id="galleryEmpty" class="hidden text-center py-10 text-coffee-400 dark:text-[#57534e]">
                <i class="fa-solid fa-images text-4xl mb-2"></i>
                <p>No moments found.</p>
            </div>
        </div>
    </div>
</div>
