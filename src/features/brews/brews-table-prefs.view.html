<div
    id="brewsTablePrefsModal"
    data-feature-root="brews"
    class="app-sheet hidden fixed inset-0 z-[90] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
    data-action-click="hideBrewsTablePrefsModal()"
>
    <div
        class="app-sheet-panel bg-white dark:bg-[#292524] rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-coffee-200 dark:border-[#44403c]"
        data-action-click="event.stopPropagation()"
    >
        <div class="app-sheet-head p-5 border-b border-coffee-200 dark:border-[#44403c] flex justify-between items-center">
            <button type="button" data-action-click="hideBrewsTablePrefsModal()" class="app-sheet-back" title="Back" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 class="app-sheet-type font-bold text-coffee-900 dark:text-white">
                <i class="fa-solid fa-table-columns"></i>Brew table columns
            </h3>
        </div>
        <div class="p-6 max-h-[60vh] overflow-y-auto">
            <p class="text-xs text-coffee-500 dark:text-[#78716c] mb-3">
                Select the columns you want to show in the brew table. These settings are stored on your device.
            </p>
            <div id="brewsTablePrefsList" class="space-y-3"></div>
        </div>
    </div>
</div>
