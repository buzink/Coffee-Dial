    <!-- Coffee Modal -->
    <div id="coffeeTypesPage" data-feature-root="coffees" data-app-page="coffees" class="hidden">
        <div class="app-page-panel">
            <div class="app-page-head">
                <h3 class="app-page-title font-bold text-xl text-coffee-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-seedling text-coffee-600 dark:text-[#d6ccc2]"></i> Coffees
                </h3>
            </div>
            <div>
                <div class="app-table-frame bg-white dark:bg-[#292524] rounded-xl shadow-lg border border-coffee-100 dark:border-[#44403c] overflow-hidden">
                    <div class="app-table-tools bg-coffee-100/50 dark:bg-[#1c1917] p-1.5 space-y-1.5 border-b border-coffee-200 dark:border-[#44403c]">
                        <div class="flex items-center gap-1.5">
                            <select id="coffeeTypesViewSelect" aria-label="Coffees view" data-action-change="coffeesChangeView(this.value)" class="bg-white dark:bg-[#292524] border border-coffee-100 dark:border-[#44403c] text-coffee-900 dark:text-white text-sm rounded-lg block p-2.5 shadow-sm font-bold min-w-[150px]">
                                <option value="mine">My coffees</option>
                            </select>
                            <div class="relative flex-1">
                                <input id="coffeeTypesSearch" type="text" placeholder="Search coffees..." data-action-input="setCoffeeTypesSearch(this.value)" class="block w-full p-2.5 pl-3 pr-20 text-sm text-coffee-900 border border-coffee-100 rounded-lg bg-white dark:bg-[#292524] dark:border-[#44403c] dark:placeholder-[#57534e] dark:text-white focus:ring-1 focus:ring-coffee-500 focus:border-coffee-500 shadow-sm transition-all">
                                <div class="absolute inset-y-0 right-0 flex items-center pr-1">
                                    <button id="coffeeTypesSearchClearBtn" data-action-click="clearCoffeeTypesSearch()" class="hidden p-2 text-coffee-400 hover:text-coffee-600 dark:hover:text-white transition-colors cursor-pointer">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                    <div class="h-6 w-px bg-coffee-200 dark:bg-[#44403c] mx-1"></div>
                                    <button data-action-click="toggleCoffeeTypesQuickFilter(event)" class="p-2 text-coffee-700 dark:text-[#d6ccc2] hover:text-coffee-900 dark:hover:text-white transition-colors">
                                        <i class="fa-solid fa-filter"></i>
                                    </button>
                                </div>
                                <div id="coffeeTypesQuickFilterDropdown" class="hidden absolute right-0 mt-2 w-72 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden"></div>
                                <div id="coffeeTypesQuickFilterValuesDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden max-h-80 overflow-y-auto"></div>
                            </div>
                        </div>
                        <div id="coffeeTypesActiveFiltersContainer" class="hidden flex items-center gap-2 flex-wrap">
                            <div class="flex items-center gap-2 flex-wrap" id="coffeeTypesActiveFiltersList"></div>
                            <button data-action-click="clearCoffeeTypesFilters()" class="text-xs text-coffee-600 dark:text-[#a8a29e] hover:text-red-500 whitespace-nowrap px-2 py-1 rounded hover:bg-coffee-50 dark:hover:bg-[#34302e] transition-colors">Clear all</button>
                        </div>
                    </div>
                    <div class="app-table-body overflow-x-auto">
                        <table class="w-full text-sm text-left text-coffee-900 dark:text-[#e7e5e4]">
                            <thead class="text-xs text-coffee-700 dark:text-[#a8a29e] uppercase bg-coffee-100/50 dark:bg-[#1c1917] border-b border-coffee-200 dark:border-[#44403c]">
                                <tr>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('name')" class="flex items-center gap-2">
                                            <span>Name</span>
                                            <span id="coffeeTypesSortIcon-name" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('farmer')" class="flex items-center gap-2">
                                            <span>Farmer</span>
                                            <span id="coffeeTypesSortIcon-farmer" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('roaster')" class="flex items-center gap-2">
                                            <span>Roaster</span>
                                            <span id="coffeeTypesSortIcon-roaster" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('origin')" class="flex items-center gap-2">
                                            <span>Origin country</span>
                                            <span id="coffeeTypesSortIcon-origin" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('originMicroRegion')" class="flex items-center gap-2">
                                            <span>Micro-region</span>
                                            <span id="coffeeTypesSortIcon-originMicroRegion" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('originMacroRegion')" class="flex items-center gap-2">
                                            <span>Macro-region</span>
                                            <span id="coffeeTypesSortIcon-originMacroRegion" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('processing')" class="flex items-center gap-2">
                                            <span>Process</span>
                                            <span id="coffeeTypesSortIcon-processing" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center w-16">
                                        <button type="button" data-action-click="setCoffeeTypesSort('decaf')" class="flex items-center gap-2 mx-auto">
                                            <span>Decaf</span>
                                            <span id="coffeeTypesSortIcon-decaf" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('variety')" class="flex items-center gap-2">
                                            <span>Variety</span>
                                            <span id="coffeeTypesSortIcon-variety" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('roast')" class="flex items-center gap-2 mx-auto">
                                            <span>Roast</span>
                                            <span id="coffeeTypesSortIcon-roast" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('brews')" class="flex items-center gap-2 mx-auto">
                                            <span>Brews</span>
                                            <span id="coffeeTypesSortIcon-brews" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('bags')" class="flex items-center gap-2 mx-auto">
                                            <span>Bags</span>
                                            <span id="coffeeTypesSortIcon-bags" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('ground')" class="flex items-center gap-2 mx-auto">
                                            <span>Ground</span>
                                            <span id="coffeeTypesSortIcon-ground" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('rating')" class="flex items-center gap-2 mx-auto">
                                            <span>Rating</span>
                                            <span id="coffeeTypesSortIcon-rating" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center w-28">
                                        <button type="button" data-action-click="setCoffeeTypesSort('createdAt')" class="flex items-center gap-2 mx-auto">
                                            <span>Created</span>
                                            <span id="coffeeTypesSortIcon-createdAt" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center w-12"><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="coffeeTypesTableBody" class="divide-y divide-coffee-50 dark:divide-[#1c1917]"></tbody>
                        </table>
                    </div>
                    <div id="coffeeTypesEmpty" class="hidden text-center py-8 text-coffee-400 dark:text-[#57534e] bg-white dark:bg-[#292524]">
                        <p>No coffees saved yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
